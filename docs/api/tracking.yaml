openapi: 3.0.3
info:
  title: paqueteria-ia — Tracking
  version: 1.0.0
  description: API del microservicio Tracking.
paths:
  /api/eventos/:
    get:
      operationId: eventos_list
      description: CRUD sobre una colección Mongo con paginación, filtros y orden.
      parameters:
      - in: query
        name: desde
        schema:
          type: string
          format: date-time
      - in: query
        name: hasta
        schema:
          type: string
          format: date-time
      - in: query
        name: ordering
        schema:
          type: string
        description: Campo; prefijo '-' para descendente
      - in: query
        name: page
        schema:
          type: integer
        description: Número de página (1 por defecto)
      - in: query
        name: page_size
        schema:
          type: integer
        description: Tamaño de página (máx. 100)
      - in: query
        name: pedido_id
        schema:
          type: integer
      - in: query
        name: repartidor_id
        schema:
          type: integer
      - in: query
        name: tipo
        schema:
          type: string
      tags:
      - eventos
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Evento'
          description: ''
    post:
      operationId: eventos_create
      description: CRUD sobre una colección Mongo con paginación, filtros y orden.
      tags:
      - eventos
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Evento'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Evento'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Evento'
        required: true
      security:
      - bearerAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Evento'
          description: ''
  /api/eventos/{id}/:
    get:
      operationId: eventos_retrieve
      description: CRUD sobre una colección Mongo con paginación, filtros y orden.
      parameters:
      - in: path
        name: id
        schema:
          type: string
        description: ID del documento
        required: true
      tags:
      - eventos
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Evento'
          description: ''
    put:
      operationId: eventos_update
      description: CRUD sobre una colección Mongo con paginación, filtros y orden.
      parameters:
      - in: path
        name: id
        schema:
          type: string
        description: ID del documento
        required: true
      tags:
      - eventos
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Evento'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Evento'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Evento'
        required: true
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Evento'
          description: ''
    patch:
      operationId: eventos_partial_update
      description: CRUD sobre una colección Mongo con paginación, filtros y orden.
      parameters:
      - in: path
        name: id
        schema:
          type: string
        description: ID del documento
        required: true
      tags:
      - eventos
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedEvento'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedEvento'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedEvento'
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Evento'
          description: ''
    delete:
      operationId: eventos_destroy
      description: CRUD sobre una colección Mongo con paginación, filtros y orden.
      parameters:
      - in: path
        name: id
        schema:
          type: string
        description: ID del documento
        required: true
      tags:
      - eventos
      security:
      - bearerAuth: []
      responses:
        '204':
          description: No response body
