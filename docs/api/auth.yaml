openapi: 3.0.3
info:
  title: paqueteria-ia — Auth & Usuarios
  version: 1.0.0
  description: API del microservicio Auth & Usuarios.
paths:
  /api/auth/change-password/:
    post:
      operationId: auth_change_password_create
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CambioPassword'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CambioPassword'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CambioPassword'
        required: true
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/auth/login/:
    post:
      operationId: auth_login_create
      description: |-
        Takes a set of user credentials and returns an access and refresh JSON web
        token pair to prove the authentication of those credentials.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenConRol'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenConRol'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenConRol'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenConRol'
          description: ''
  /api/auth/logout/:
    post:
      operationId: auth_logout_create
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Logout'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Logout'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Logout'
        required: true
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/auth/me/:
    get:
      operationId: auth_me_retrieve
      tags:
      - auth
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Perfil'
          description: ''
    put:
      operationId: auth_me_update
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Perfil'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Perfil'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Perfil'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Perfil'
          description: ''
    patch:
      operationId: auth_me_partial_update
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedPerfil'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedPerfil'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedPerfil'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Perfil'
          description: ''
  /api/auth/refresh/:
    post:
      operationId: auth_refresh_create
      description: |-
        Takes a refresh type JSON web token and returns an access type JSON web
        token if the refresh token is valid.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefresh'
          description: ''
  /api/auth/register/:
    post:
      operationId: auth_register_create
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Registro'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Registro'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Registro'
        required: true
      security:
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Registro'
          description: ''
  /api/users/:
    get:
      operationId: users_list
      parameters:
      - in: query
        name: is_active
        schema:
          type: boolean
      - name: ordering
        required: false
        in: query
        description: Qué campo usar para ordenar los resultados.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: Un número de página dentro del conjunto de resultados paginado.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Número de resultados a devolver por página.
        schema:
          type: integer
      - in: query
        name: rol
        schema:
          type: string
          enum:
          - admin_sistema
          - cliente
          - gerente
          - operador
          - repartidor
        description: |-
          * `cliente` - Cliente
          * `repartidor` - Repartidor
          * `operador` - Operador / Despachador
          * `gerente` - Gerente
          * `admin_sistema` - Administrador del sistema
      - name: search
        required: false
        in: query
        description: Un término de búsqueda.
        schema:
          type: string
      tags:
      - users
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedUsuarioAdminList'
          description: ''
    post:
      operationId: users_create
      tags:
      - users
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UsuarioAdmin'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/UsuarioAdmin'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UsuarioAdmin'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsuarioAdmin'
          description: ''
  /api/users/{id}/:
    get:
      operationId: users_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Un valor de entero único que identifique este user.
        required: true
      tags:
      - users
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsuarioAdmin'
          description: ''
    put:
      operationId: users_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Un valor de entero único que identifique este user.
        required: true
      tags:
      - users
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UsuarioAdmin'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/UsuarioAdmin'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UsuarioAdmin'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsuarioAdmin'
          description: ''
    patch:
      operationId: users_partial_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Un valor de entero único que identifique este user.
        required: true
      tags:
      - users
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedUsuarioAdmin'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedUsuarioAdmin'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedUsuarioAdmin'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsuarioAdmin'
          description: ''
    delete:
      operationId: users_destroy
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Un valor de entero único que identifique este user.
        required: true
      tags:
      - users
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
components:
  schemas:
    CambioPassword:
      type: object
      properties:
        password_actual:
          type: string
          writeOnly: true
        password_nueva:
          type: string
          writeOnly: true
      required:
      - password_actual
      - password_nueva
    Logout:
      type: object
      properties:
        refresh:
          type: string
      required:
      - refresh
    PaginatedUsuarioAdminList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/UsuarioAdmin'
    PatchedPerfil:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        email:
          type: string
          format: email
          readOnly: true
        first_name:
          type: string
          title: Nombre
          maxLength: 150
        last_name:
          type: string
          title: Apellido
          maxLength: 150
        telefono:
          type: string
          maxLength: 20
        rol:
          allOf:
          - $ref: '#/components/schemas/RolEnum'
          readOnly: true
    PatchedUsuarioAdmin:
      type: object
      description: Alta/edición por el administrador del sistema (puede fijar rol).
      properties:
        id:
          type: integer
          readOnly: true
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          writeOnly: true
        first_name:
          type: string
          title: Nombre
          maxLength: 150
        last_name:
          type: string
          title: Apellido
          maxLength: 150
        telefono:
          type: string
          maxLength: 20
        rol:
          $ref: '#/components/schemas/RolEnum'
        is_active:
          type: boolean
          title: Activo
          description: Indica si el usuario debe ser tratado como un usuario activo.
            Desactive este campo en lugar de eliminar usuarios.
    Perfil:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        email:
          type: string
          format: email
          readOnly: true
        first_name:
          type: string
          title: Nombre
          maxLength: 150
        last_name:
          type: string
          title: Apellido
          maxLength: 150
        telefono:
          type: string
          maxLength: 20
        rol:
          allOf:
          - $ref: '#/components/schemas/RolEnum'
          readOnly: true
      required:
      - email
      - id
      - rol
    Registro:
      type: object
      description: 'Registro público: siempre crea usuarios con rol cliente.'
      properties:
        id:
          type: integer
          readOnly: true
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          writeOnly: true
        first_name:
          type: string
          title: Nombre
          maxLength: 150
        last_name:
          type: string
          title: Apellido
          maxLength: 150
        telefono:
          type: string
          maxLength: 20
      required:
      - email
      - id
      - password
    RolEnum:
      enum:
      - cliente
      - repartidor
      - operador
      - gerente
      - admin_sistema
      type: string
      description: |-
        * `cliente` - Cliente
        * `repartidor` - Repartidor
        * `operador` - Operador / Despachador
        * `gerente` - Gerente
        * `admin_sistema` - Administrador del sistema
    TokenConRol:
      type: object
      description: Incluye email y rol en el token para que los demás servicios no
        consulten a auth.
      properties:
        email:
          type: string
          writeOnly: true
        password:
          type: string
          writeOnly: true
      required:
      - email
      - password
    TokenRefresh:
      type: object
      properties:
        access:
          type: string
          readOnly: true
        refresh:
          type: string
      required:
      - access
      - refresh
    UsuarioAdmin:
      type: object
      description: Alta/edición por el administrador del sistema (puede fijar rol).
      properties:
        id:
          type: integer
          readOnly: true
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          writeOnly: true
        first_name:
          type: string
          title: Nombre
          maxLength: 150
        last_name:
          type: string
          title: Apellido
          maxLength: 150
        telefono:
          type: string
          maxLength: 20
        rol:
          $ref: '#/components/schemas/RolEnum'
        is_active:
          type: boolean
          title: Activo
          description: Indica si el usuario debe ser tratado como un usuario activo.
            Desactive este campo en lugar de eliminar usuarios.
      required:
      - email
      - id
  securitySchemes:
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
