components:
  schemas:
    CambioEstado:
      type: object
      properties:
        estado:
          $ref: '#/components/schemas/EstadoEnum'
        comentario:
          type: string
          maxLength: 255
      required:
      - estado
    Cliente:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        nombre:
          type: string
          maxLength: 120
        telefono:
          type: string
          maxLength: 20
        email:
          oneOf:
          - type: string
            format: email
            maxLength: 254
          - type: string
            maxLength: 0
        usuario_id:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
          nullable: true
          description: ID de usuario (auth) dueño del cliente; acota lo que ve el
            rol cliente
        creado:
          type: string
          format: date-time
          readOnly: true
        direcciones:
          type: array
          items:
            $ref: '#/components/schemas/Direccion'
          readOnly: true
      required:
      - creado
      - direcciones
      - id
      - nombre
      - telefono
    Direccion:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        calle:
          type: string
          maxLength: 150
        numero:
          type: string
          maxLength: 20
        colonia:
          type: string
          maxLength: 100
        ciudad:
          type: string
          maxLength: 100
        estado:
          type: string
          maxLength: 100
        codigo_postal:
          type: string
          maxLength: 5
        referencias:
          type: string
        latitud:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,6})?$
          nullable: true
        longitud:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,6})?$
          nullable: true
        cliente:
          type: integer
      required:
      - calle
      - ciudad
      - cliente
      - codigo_postal
      - colonia
      - id
      - numero
    EstadoEnum:
      enum:
      - creado
      - en_ruta
      - entregado
      - incidencia
      - devuelto
      type: string
      description: |-
        * `creado` - Creado
        * `en_ruta` - En ruta
        * `entregado` - Entregado
        * `incidencia` - Incidencia
        * `devuelto` - Devuelto
    HistorialEstado:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        estado_anterior:
          $ref: '#/components/schemas/EstadoEnum'
        estado_nuevo:
          $ref: '#/components/schemas/EstadoEnum'
        usuario_id:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
          nullable: true
        comentario:
          type: string
          maxLength: 255
        fecha:
          type: string
          format: date-time
          readOnly: true
        pedido:
          type: integer
      required:
      - estado_anterior
      - estado_nuevo
      - fecha
      - id
      - pedido
    PaginatedClienteList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/Cliente'
    PaginatedDireccionList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/Direccion'
    PaginatedPedidoList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/Pedido'
    PatchedCliente:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        nombre:
          type: string
          maxLength: 120
        telefono:
          type: string
          maxLength: 20
        email:
          oneOf:
          - type: string
            format: email
            maxLength: 254
          - type: string
            maxLength: 0
        usuario_id:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
          nullable: true
          description: ID de usuario (auth) dueño del cliente; acota lo que ve el
            rol cliente
        creado:
          type: string
          format: date-time
          readOnly: true
        direcciones:
          type: array
          items:
            $ref: '#/components/schemas/Direccion'
          readOnly: true
    PatchedDireccion:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        calle:
          type: string
          maxLength: 150
        numero:
          type: string
