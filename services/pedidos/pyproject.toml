[tool.black]
line-length = 100

[tool.isort]
profile = "black"
line_length = 100

[tool.ruff]
line-length = 100
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "pedidos.settings"
python_files = ["test_*.py", "tests.py"]
pythonpath = ["."]
