name: services

on:
  pull_request:
    paths: ["services/**", "docker-compose.yml", "postman/**", ".github/workflows/services.yml"]
  push:
    branches: [main, develop]
    paths: ["services/**", "docker-compose.yml", "postman/**", ".github/workflows/services.yml"]

jobs:
  lint-test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        service: [auth, pedidos, tracking, chatbot]
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    env:
      USE_SQLITE: "true" # los tests de servicios SQL no necesitan PostgreSQL
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: services/${{ matrix.service }}/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: black --check .
      - run: isort --check .
      - run: pytest

  e2e:
    needs: lint-test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Preparar .env efímero
        run: |
          {
            echo "DJANGO_SECRET_KEY=$(openssl rand -hex 24)"
            echo "JWT_SIGNING_KEY=$(openssl rand -hex 32)"
            echo "POSTGRES_PASSWORD=$(openssl rand -hex 12)"
            echo "DEMO_PASSWORD=Demo-$(openssl rand -hex 6)-Aa1"
          } > .env
      - run: docker compose up --build -d --wait
      - run: docker compose exec -T auth python manage.py seed_demo
      - name: Colección Postman (newman)
        run: |
          PW=$(grep '^DEMO_PASSWORD=' .env | cut -d= -f2-)
          npx -y newman run postman/Entregable-2.postman_collection.json \
            -e postman/Entregable-2-local.postman_environment.json --env-var "demo_password=$PW"
      - if: failure()
        run: docker compose logs --tail=100
